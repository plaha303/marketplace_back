volumes:
  marketplace_db_data:
  redis_data:

services:
  marketplace_database:
    image: postgres:alpine
    container_name: marketplace_database
    restart: unless-stopped
    volumes:
      - marketplace_db_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    ports:
      - "5432:5432"
    expose:
      - "5432"
    env_file:
      - backend_api/.env
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      SCHEMA: public
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:alpine
    container_name: marketplace_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  user_service:
    build:
      context: ./backend_api/user_service
      dockerfile: Dockerfile
    container_name: user_service
    restart: unless-stopped
    ports:
      - "8000:8000"
    expose:
      - "8000"
    depends_on:
      marketplace_database:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - backend_api/.env
    environment:
      DJANGO_SETTINGS_MODULE: settings
      DB_HOST: marketplace_database
      DB_PORT: 5432
      REDIS_URL: redis://marketplace_redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: ${DEBUG}
      ALLOWED_HOSTS: "*"
      ORDER_SERVICE_URL: http://order_service:8000
      USER_SERVICE_URL: http://user_service:8000
      PAYMENT_SERVICE_URL: http://payment_service:8000
    volumes:
      - ./backend_api/user_service:/app
      - ./backend_api/user_service/staticfiles:/app/staticfiles
    command: >
      sh -c "./wait-for-db.sh marketplace_database 5432 &&
             python manage.py makemigrations app &&
             python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn --bind 0.0.0.0:8000 wsgi:application"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  user_service_celery:
    build:
      context: ./backend_api/user_service
      dockerfile: Dockerfile
    container_name: user_service_celery
    restart: unless-stopped
    volumes:
      - ./backend_api/user_service:/app
    command: >
      sh -c "./wait-for-db.sh marketplace_database 5432 &&
             celery -A celery_app worker -l info"
    depends_on:
      marketplace_database:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - backend_api/.env
    environment:
      DJANGO_SETTINGS_MODULE: settings
      REDIS_URL: redis://marketplace_redis:6379/0
      DATABASE_URL: postgres://${DB_USERNAME}:${DB_PASSWORD}@marketplace_database:5432/${DB_DATABASE}?options=-c%20search_path=user_service

  user_service_celery_beat:
    build:
      context: ./backend_api/user_service
      dockerfile: Dockerfile
    container_name: user_service_celery_beat
    restart: unless-stopped
    volumes:
      - ./backend_api/user_service:/app
    command: >
      sh -c "./wait-for-db.sh marketplace_database 5432 &&
