volumes:
  marketplace_db_data:
  redis_data:

services:
  marketplace_database:
    image: postgres:alpine
    container_name: marketplace_database
    restart: unless-stopped
    volumes:
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./init-extensions.sql:/docker-entrypoint-initdb.d/00-init-extensions.sql
      - marketplace_db_data:/var/lib/postgresql/data
    ports:
      - 5432:5432
    expose:
      - 5432
    env_file:
      - backend_api/.env
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      SCHEMA: public
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: marketplace_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - 6379:6379
    expose:
      - 6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-extensions-init:
    image: postgres:alpine
    depends_on:
      marketplace_database:
        condition: service_healthy
    environment:
      PGPASSWORD: ${DB_PASSWORD}
      PGUSER: ${DB_USERNAME}
      PGDATABASE: ${DB_DATABASE}
    entrypoint: >
      sh -c "
      until pg_isready -h marketplace_database -U ${DB_USERNAME} -d ${DB_DATABASE}; do sleep 1; done;
      psql -h marketplace_database -U ${DB_USERNAME} -d ${DB_DATABASE} -f /docker-entrypoint-initdb.d/00-init-extensions.sql;
      psql -h marketplace_database -U ${DB_USERNAME} -d ${DB_DATABASE} -c 'CREATE SCHEMA IF NOT EXISTS user_service;';
      psql -h marketplace_database -U ${DB_USERNAME} -d ${DB_DATABASE} -c 'CREATE SCHEMA IF NOT EXISTS order_service;'
      "

  user_service:
    build:
      context: ./backend_api/user_service
    container_name: user_service
    restart: unless-stopped
    ports:
      - "8000:8000"
    expose:
      - 8000
    depends_on:
      marketplace_database:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - backend_api/.env
    environment:
      DB_HOST: marketplace_database
      REDIS_URL: redis://marketplace_redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: ${DEBUG}
      ALLOWED_HOSTS: localhost,127.0.0.1,user_service
      ORDER_SERVICE_URL: http://order_service:8001
    volumes:
      - ./backend_api/user_service:/app
    command: >
      sh -c "./wait-for-db.sh marketplace_database 5432 &&
             python manage.py makemigrations app &&
             python manage.py migrate --noinput || { echo 'migrate failed'; exit 1; } &&
             echo 'Starting server...' &&
             gunicorn --bind 0.0.0.0:8000 wsgi:application"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3

  user-service-celery:
    build:
      context: ./backend_api/user_service
    container_name: user_service_celery
    volumes:
      - ./backend_api/user_service:/app
    command: >
      sh -c "./wait-for-db.sh marketplace_database 5432 &&
             celery -A celery_app worker -l info"
    depends_on:
      - marketplace_database
      - redis
    environment:
      - DJANGO_SETTINGS_MODULE=user_service.settings
      - REDIS_URL=redis://marketplace_redis:6379/0
      - DATABASE_URL=postgres://marketplace_user:marketplace_password@marketplace_database:5432/marketplace_db

  user-service-celery-beat:
    build:
      context: ./backend_api/user_service
    container_name: user_service_celery_beat
    volumes:
      - ./backend_api/user_service:/app
    command: >
      sh -c "./wait-for-db.sh marketplace_database 5432 &&
             celery -A celery_app beat -l info"
    depends_on:
      - marketplace_database
      - redis
    environment:
      - DJANGO_SETTINGS_MODULE=user_service.settings
      - REDIS_URL=redis://marketplace_redis:6379/0
      - DATABASE_URL=postgres://marketplace_user:marketplace_password@marketplace_database:5432/marketplace_db

  order_service:
    build:
      context: ./backend_api/order_service
    container_name: order_service
    restart: unless-stopped
    ports:
      - "8001:8000"
    expose:
      - 8000
    depends_on:
      marketplace_database:
        condition: service_healthy
      redis:
        condition: service_healthy
      user_service:
        condition: service_healthy
    env_file:
      - backend_api/.env
    environment:
      DB_HOST: marketplace_database
      REDIS_URL: redis://marketplace_redis:6379/1  # Окрема база Redis для ізоляції
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: ${DEBUG}
      ALLOWED_HOSTS: localhost,127.0.0.1,order_service
      USER_SERVICE_URL: http://user_service:8000
    volumes:
      - ./backend_api/order_service:/app
    command: >
      sh -c "./wait-for-db.sh marketplace_database 5432 &&
             python manage.py makemigrations app &&
             python manage.py migrate --noinput || { echo 'migrate failed'; exit 1; } &&
             echo 'Starting server...' &&
             gunicorn --bind 0.0.0.0:8000 wsgi:application"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3

  order-service-celery:
    build:
      context: ./backend_api/order_service
    container_name: order_service_celery
    volumes:
      - ./backend_api/order_service:/app
    command: >
      sh -c "./wait-for-db.sh marketplace_database 5432 &&
             celery -A celery_app worker -l info"
    depends_on:
      - marketplace_database
      - redis
      - user_service
    environment:
      - DJANGO_SETTINGS_MODULE=order_service.settings
      - REDIS_URL=redis://marketplace_redis:6379/1
      - DATABASE_URL=postgres://marketplace_user:marketplace_password@marketplace_database:5432/marketplace_db

  order-service-celery-beat:
    build:
      context: ./backend_api/order_service
    container_name: order_service_celery_beat
    volumes:
      - ./backend_api/order_service:/app
    command: >
      sh -c "./wait-for-db.sh marketplace_database 5432 &&
             celery -A celery_app beat -l info"
    depends_on:
      - marketplace_database
      - redis
      - user_service
    environment:
      - DJANGO_SETTINGS_MODULE=order_service.settings
      - REDIS_URL=redis://marketplace_redis:6379/1
      - DATABASE_URL=postgres://marketplace_user:marketplace_password@marketplace_database:5432/marketplace_db
